apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeradius-pqc
  namespace: freeradius-experimentation
  labels:
    app: freeradius-pqc
spec:
  replicas: 1
  # Configuration changes roll out on 'kubectl apply -k' without an image build
  # or a manual restart: kustomize names each generated ConfigMap after a hash
  # of its contents, so changing any mounted file (radiusd.conf included)
  # changes the pod template and starts a new pod. The old pod keeps serving
  # until the new one has stayed up for minReadySeconds. radiusd exits within a
  # second on broken configuration, so a broken change never replaces a working
  # server: the rollout stalls instead (see "Changing the server
  # configuration" in the README).
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: freeradius-pqc
  template:
    metadata:
      labels:
        app: freeradius-pqc
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freeradius
          image: ghcr.io/andrewnicolalde/homelab-nac/freeradius@sha256:4913324733a6047a9b71cfa62ce9e250b614d94fabaa6b2a7f783ba89c05e368 # FreeRADIUS 3.2.10
          imagePullPolicy: IfNotPresent
          # Foreground, logging to stdout, without debug output: every debug
          # level (-X, -x) prints the MS-MPPE session keys of each Access-Accept.
          # Admission decisions are logged by mods-enabled/cert_log instead.
          args: ["-f", "-l", "stdout"]
          envFrom:
            # RADIUS client shared secrets, referenced from clients.conf as $ENV{...}
            - secretRef:
                name: freeradius-client-secrets
          env:
            # Pins TLS 1.3 ciphersuites and PQ groups process-wide (see config/openssl.cnf)
            - name: OPENSSL_CONF
              value: /etc/raddb/openssl-pqc.cnf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: radsec
              containerPort: 2083
              protocol: TCP
            - name: radius-auth
              containerPort: 1812
              protocol: UDP
            - name: radius-acct
              containerPort: 1813
              protocol: UDP
          volumeMounts:
            # Server settings (proxying off). The image ships a copy as its
            # default; this mount lets it change without an image build.
            - name: config
              mountPath: /etc/raddb/radiusd.conf
              subPath: radiusd.conf
              readOnly: true
            # Certificates, clients and authorization rules are shared with the
            # classical deployment in ../k8s
            - name: certs
              mountPath: /etc/raddb/certs/ca.pem
              subPath: ca.pem
              readOnly: true
            - name: certs
              mountPath: /etc/raddb/certs/server.pem
              subPath: server.pem
              readOnly: true
            - name: config
              mountPath: /etc/raddb/clients.conf
              subPath: clients.conf
              readOnly: true
            - name: config
              mountPath: /etc/raddb/mods-config/files/authorize
              subPath: authorize
              readOnly: true
            # Post-quantum TLS configuration
            - name: pqc-config
              mountPath: /etc/raddb/mods-enabled/eap
              subPath: eap
              readOnly: true
            - name: pqc-config
              mountPath: /etc/raddb/openssl-pqc.cnf
              subPath: openssl.cnf
              readOnly: true
            # Admission and VLAN assignment from the verified client
            # certificate CN (called by EAP-TLS; fails closed). Shared with
            # the classical deployment via the freeradius-config ConfigMap
            - name: config
              mountPath: /etc/raddb/sites-enabled/check-eap-tls
              subPath: check-eap-tls
              readOnly: true
            - name: config
              mountPath: /etc/raddb/mods-enabled/cert_vlan
              subPath: cert_vlan
              readOnly: true
            - name: config
              mountPath: /etc/raddb/mods-enabled/cert_log
              subPath: cert_log
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: freeradius-certs
            defaultMode: 0440
        - name: config
          configMap:
            name: freeradius-config
            defaultMode: 0440
        - name: pqc-config
          configMap:
            name: freeradius-pqc-config
            defaultMode: 0440
