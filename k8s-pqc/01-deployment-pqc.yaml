apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeradius-pqc
  namespace: freeradius-experimentation
  labels:
    app: freeradius-pqc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freeradius-pqc
  template:
    metadata:
      labels:
        app: freeradius-pqc
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freeradius
          image: ghcr.io/andrewnicolalde/homelab-nac/freeradius@sha256:b74e8d0cf81d4e37b4601e2c45225c9f78f350d8ad7ff27c81f0964d3f09757c
          imagePullPolicy: IfNotPresent
          args: ["-X"]
          envFrom:
            # RADIUS client shared secrets, referenced from clients.conf as $ENV{...}
            - secretRef:
                name: freeradius-client-secrets
          env:
            # Pins TLS 1.3 ciphersuites and PQ groups process-wide (see config/openssl.cnf)
            - name: OPENSSL_CONF
              value: /etc/raddb/openssl-pqc.cnf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: radsec
              containerPort: 2083
              protocol: TCP
            - name: radius-auth
              containerPort: 1812
              protocol: UDP
            - name: radius-acct
              containerPort: 1813
              protocol: UDP
          volumeMounts:
            # Certificates, clients and authorization rules are shared with the
            # classical deployment in ../k8s
            - name: certs
              mountPath: /etc/raddb/certs/ca.pem
              subPath: ca.pem
              readOnly: true
            - name: certs
              mountPath: /etc/raddb/certs/server.pem
              subPath: server.pem
              readOnly: true
            - name: config
              mountPath: /etc/raddb/clients.conf
              subPath: clients.conf
              readOnly: true
            - name: config
              mountPath: /etc/raddb/mods-config/files/authorize
              subPath: authorize
              readOnly: true
            # Post-quantum TLS configuration
            - name: pqc-config
              mountPath: /etc/raddb/mods-enabled/eap
              subPath: eap
              readOnly: true
            - name: pqc-config
              mountPath: /etc/raddb/openssl-pqc.cnf
              subPath: openssl.cnf
              readOnly: true
            # Admission and VLAN assignment from the verified client
            # certificate CN (called by EAP-TLS; fails closed). Shared with
            # the classical deployment via the freeradius-config ConfigMap
            - name: config
              mountPath: /etc/raddb/sites-enabled/check-eap-tls
              subPath: check-eap-tls
              readOnly: true
            - name: config
              mountPath: /etc/raddb/mods-enabled/cert_vlan
              subPath: cert_vlan
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: freeradius-certs
            defaultMode: 0440
        - name: config
          configMap:
            name: freeradius-config
            defaultMode: 0440
        - name: pqc-config
          configMap:
            name: freeradius-pqc-config
            defaultMode: 0440
