apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: freeradius-experimentation

resources:
  - 00-namespace.yaml
  - 01-deployment-test.yaml
  - 02-service.yaml

secretGenerator:
  # RADIUS client shared secrets, loaded as environment variables and
  # referenced from clients.conf as $ENV{...}. Replace in your overlay.
  - name: freeradius-client-secrets
    literals:
      - RADIUS_SECRET_AUTHENTICATORS=PLACEHOLDER_REPLACE_IN_OVERLAY
      - RADIUS_SECRET_TEST=PLACEHOLDER_REPLACE_IN_OVERLAY
  - name: freeradius-certs
    literals:
      - ca.pem="PLACEHOLDER_REPLACE_IN_OVERLAY"
      - server.pem="PLACEHOLDER_REPLACE_IN_OVERLAY"
      # Root CA of the access points' RadSec client certificate (only)
      - authenticators-ca.pem="PLACEHOLDER_REPLACE_IN_OVERLAY"

configMapGenerator:
  - name: freeradius-config
    files:
      # Server settings; also baked into the image as its default
      - radiusd.conf=./config/radiusd.conf
      - clients.conf=./config/clients.conf.example
      - eap=./config/eap
      - authorize=./config/authorize.example
      # Shared admission/VLAN policy (also mounted by ../k8s-pqc)
      - check-eap-tls=./config/check-eap-tls
      - cert_vlan=./config/cert_vlan
      - cert_log=./config/cert_log
      # RadSec listener for the access points (also mounted by ../k8s-pqc)
      - radsec=./config/radsec
  # Subject of the authenticator root CA, pinned by the RadSec listener
  # (check_cert_issuer), e.g. "/CN=<CA name>". Loaded as an environment
  # variable. Replace in your overlay.
  - name: freeradius-radsec
    literals:
      - RADSEC_AUTHENTICATOR_ISSUER=PLACEHOLDER_REPLACE_IN_OVERLAY
