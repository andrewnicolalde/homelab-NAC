# ==============================================================================
# FreeRADIUS Main Configuration (radiusd.conf)
# The server's own settings: where its files are, logging, limits, security,
# and which other configuration files it reads
# ==============================================================================
# Replaces the stock radiusd.conf, which is ~1,270 lines but only ~65 settings;
# the rest is comments. Every setting below is the stock FreeRADIUS 3.2.10 value
# except one: proxying is turned off (see PROXYING).
#
# Settings left out here fall back to FreeRADIUS's built-in defaults.
#
# Where this file is used:
#   - Both Deployments mount it from the freeradius-config ConfigMap, so a
#     change here reaches the cluster with 'kubectl apply -k', with no image
#     build and no manual restart (see "Changing the server configuration" in
#     the README).
#   - The image (docker/Dockerfile) also ships a copy as its default, so the
#     image alone never runs with the stock settings. That copy is updated
#     whenever the image is rebuilt, and may lag behind this file.
#   - test/guarantees.sh mounts it in the functional tests, so a change can be
#     tested locally without rebuilding the image.
#
# Upgrading FreeRADIUS: upstream changes to its radiusd.conf are not picked up
# automatically. Compare the settings (not the comments) of the old and new
# stock files, and copy over anything new that applies:
#   sed 's/#.*//' radiusd.conf | grep -v '^[[:space:]]*$'
# ==============================================================================

# ------------------------------------------------------------------------------
# File locations
# ------------------------------------------------------------------------------
# These must match how the image is built (./configure in the Dockerfile).
# A ${...} reference only works after the setting it names, so order matters.

# Program name, used in the paths below and in log lines
name = radiusd

prefix = /usr
exec_prefix = ${prefix}
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
libdir = ${exec_prefix}/lib

# Configuration files (this file, clients.conf, mods-*, sites-*, certs)
raddbdir = ${sysconfdir}/raddb
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
certdir = ${confdir}/certs
cadir   = ${confdir}/certs
db_dir = ${raddbdir}

# Writable directories, created in the Dockerfile and owned by the radius user.
# The pid file is only written when the server runs in the background, which
# it never does here (the image runs it with -f).
logdir = ${localstatedir}/log/radius
radacctdir = ${logdir}/radacct
run_dir = ${localstatedir}/run/${name}
pidfile = ${run_dir}/${name}.pid

# Helper the server can run to ask an authenticator whether a user is still
# logged in. Only used for limiting simultaneous logins, which we don't do.
checkrad = ${sbindir}/checkrad

# ------------------------------------------------------------------------------
# Limits
# ------------------------------------------------------------------------------
# Give up on a login request still being processed after 30 seconds
max_request_time = 30

# Keep a finished reply for 5 seconds, so an authenticator that resends the
# same request (because the reply was lost) gets the same answer
cleanup_delay = 5

# Maximum login requests in progress at once
max_requests = 16384

# Log IP addresses as-is rather than looking up their DNS names
hostname_lookups = no

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
# The Deployments run radiusd with '-l stdout', which sends the log to the
# container output and overrides 'destination' and 'file' below. Admission
# decisions are logged by mods-enabled/cert_log, not by the auth* options here.
log {
	destination = files
	file = ${logdir}/radius.log
	syslog_facility = daemon

	# Colour log output, only when writing to a terminal
	colourise = yes

	# Log the username exactly as the device sent it
	stripped_names = no

	# Don't log a line per login, and never log passwords
	auth = no
	auth_badpass = no
	auth_goodpass = no

	msg_denied = "You are already logged in - access denied"
}

# ------------------------------------------------------------------------------
# Security
# ------------------------------------------------------------------------------
security {
	# Never write memory dumps (which can contain keys) if the server crashes
	allow_core_dumps = no

	# Reject requests carrying more than 200 attributes (fields)
	max_attributes = 200

	# Wait 1 second before sending a rejection, slowing down guessing attacks
	reject_delay = 1

	# Answer "are you alive?" checks (Status-Server) from authenticators listed
	# in clients.conf; they still need the shared secret
	status_server = yes

	# Require every request to carry a Message-Authenticator, a signature made
	# with the authenticator's shared secret (defends against the BlastRADIUS
	# attack). Individual clients in clients.conf can override this.
	require_message_authenticator = yes
	limit_proxy_state = auto

	# Refuse to start if linked against an OpenSSL version with known
	# vulnerabilities
	allow_vulnerable_openssl = no
}

# ------------------------------------------------------------------------------
# PROXYING: turned off
# ------------------------------------------------------------------------------
# FreeRADIUS can forward a login to another RADIUS server based on the domain
# at the end of the username (client-device-01@example.com). The device picks
# that username itself, before any certificate is checked, so with proxying on
# it could choose a domain that sends its login elsewhere instead of through
# our certificate and 'authorize' checks. Our  server is configured to never forward: every
# login is decided here. The stock proxy.conf (the list of where to forward
# each domain) is not read, and this image's Dockerfile removes it.
proxy_requests = no

# ------------------------------------------------------------------------------
# Authenticators allowed to send login requests (access points, switches)
# ------------------------------------------------------------------------------
$INCLUDE clients.conf

# ------------------------------------------------------------------------------
# Worker threads
# ------------------------------------------------------------------------------
thread pool {
	# Threads started at launch, and the most that may run at once
	start_servers = 5
	max_servers = 32

	# Keep between 3 and 10 idle threads ready for new requests
	min_spare_servers = 3
	max_spare_servers = 10

	# Never retire a thread after a fixed number of requests
	max_requests_per_server = 0

	# Don't limit accounting (usage reporting) requests separately when busy
	auto_limit_acct = no
}

# ------------------------------------------------------------------------------
# Modules, policies and sites
# ------------------------------------------------------------------------------
# Building blocks (eap, files, cert_vlan, cert_log, ...), each in its own file
modules {
	$INCLUDE mods-enabled/
}

# Reusable rule snippets used by the sites
policy {
	$INCLUDE policy.d/
}

# The request-handling logic: default, inner-tunnel, and check-eap-tls
# (mounted by the Deployments)
$INCLUDE sites-enabled/
