# ==============================================================================
# eapol_test Configuration: CNSA Suite B 192-bit WPA3-Enterprise EAP-TLS
# ==============================================================================
# This configuration instructs eapol_test to act as the "client-device-01" client,
# enforcing strict WPA3-Enterprise 192-bit (CNSA) parameters:
#   - EAP Method: TLS (EAP-TLS)
#   - Cipher Suite: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
#   - Curve: NIST P-384 (secp384r1)
#   - Digest: SHA-384
# ==============================================================================

network={
    ssid="ENTERPRISE-WIFI"  # Placeholder SSID for testing

    # Enforces CNSA Suite B 192-bit mode (AKM suite 00-0F-AC:13).
    # eapol_test will fail immediately if the server presents non-compliant
    # certificates (e.g. RSA or P-256) or negotiates a non-Suite-B cipher suite.
    key_mgmt=WPA-EAP-SUITE-B-192

    eap=TLS
    identity="client-device-01"
    
    # Path inside the test container where certificates are mounted
    ca_cert="/certs/ca.pem"
    client_cert="/certs/client.crt"
    private_key="/certs/client.key"
    
    # Strict TLS version gating:
    # Disable TLS 1.0, 1.1, and 1.3 (FreeRADIUS 3.0 WPA3 192-bit standardizes on TLS 1.2)
    phase1="tls_disable_tlsv1_0=1 tls_disable_tlsv1_1=1 tls_disable_tlsv1_3=1"
    
    # Mandatory Suite B 192-bit cipher suite
    openssl_ciphers="ECDHE-ECDSA-AES256-GCM-SHA384"
}
