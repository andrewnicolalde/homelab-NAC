# ==============================================================================
# eapol_test Configuration: Post-Quantum EAP-TLS 1.3 (k8s-pqc deployment)
# ==============================================================================
# Acts as "client-device-01" against the post-quantum FreeRADIUS deployment:
#   - Outer Identity: "anonymous", as Apple TLS 1.3 profiles send; the server
#     assigns the VLAN from the client certificate CN (client-device-01)
#   - EAP Method: TLS (EAP-TLS, RFC 9190)
#   - TLS Version: 1.3 only
#   - Key Exchange: hybrid X25519MLKEM768 (OpenSSL >= 3.5 default key share)
#
# wpa_supplicant exposes no client-side group selection; the offered groups
# come from the linked OpenSSL. The image must therefore be built on an
# OpenSSL >= 3.5 base, otherwise the server rejects the handshake with
# "no suitable key share":
#
#   IMAGE_NAME=eapol-test:pqc ALPINE_VERSION=3.24.1 \
#       ./run-test.sh 10.50.0.100 31822 "" eapol_test-pqc.conf
# ==============================================================================

network={
    ssid="ENTERPRISE-WIFI"  # Placeholder SSID for testing

    # eapol_test does not associate, so key_mgmt does not affect the TLS
    # handshake. Do NOT enable wpa_supplicant's TLS Suite B constraints
    # (phase1="tls_suiteb=1" or openssl_ciphers="SUITEB192"): they restrict
    # key exchange to P-384, which this server rejects. They are opt-in and
    # are not implied by key_mgmt=WPA-EAP-SUITE-B-192.
    key_mgmt=WPA-EAP

    eap=TLS
    identity="anonymous"

    # Path inside the test container where certificates are mounted
    ca_cert="/certs/ca.pem"
    client_cert="/certs/client.crt"
    private_key="/certs/client.key"

    # TLS 1.3 only
    phase1="tls_disable_tlsv1_0=1 tls_disable_tlsv1_1=1 tls_disable_tlsv1_2=1 tls_disable_tlsv1_3=0"
}
